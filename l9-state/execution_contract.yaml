- id: STATE-03
  repo: l9-state
  title: Deliver committed events and exact recovery without provider leakage
  phase: 3
  depends_on:
  - STATE-02
  - GATE-02
  status: not_started
  authority: implementation_contract; requires current repository baseline and user-authorized execution session
  allowed_paths:
  - src/
  - tests/
  - contracts/
  - docs/
  - pyproject.toml
  - uv.lock
  forbidden_changes:
  - other repositories in this unit
  - production deployment
  - live data migration without explicit authorization
  - secret changes
  - weakening owner invariants
  - unrelated cleanup
  deliverables:
  - event cursor contract
  - outbox publisher
  - checkpoint history
  - scoped state enumeration and operation inspection
  - cold-resume proof
  steps:
  - Use Mongo Change Streams only as wakeup, or bounded polling over durable journal.
  - Persist scoped consumer checkpoint/ack separately from provider resume token.
  - Define cursor expiry/resync and cancellation/tombstone behavior.
  - Validate publication replay idempotency through Gate and isolated multi-manifestation access.
  acceptance:
  - Lost provider cursor can rebuild notification progress from canonical retained journal.
  - Event stream never confuses later updateLookup with exact committed transition.
  negative_proofs:
  - Duplicate event does not duplicate downstream intent.
  - Cross-consumer ack and out-of-scope cursor fail.
