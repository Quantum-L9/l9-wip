  deliverables:
  - Mongo adapter
  - transaction/index migrations
  - restart tests
  - lease conformance
  steps:
  - Pin approved Mongo/PyMongo versions and replica-set deployment.
  - Create private state, operation, journal/outbox and consumer-checkpoint collections with scoped uniqueness.
  - Implement expected-revision conditional mutation and monotonic fencing in transactional unit of work.
  - Test concurrent writers, lease expiry, paused old holder, transaction retries and network ambiguity.
  acceptance:
  - Only one concurrent mutation wins and receipt/event commit is atomic.
  - No expired/reassigned holder can mutate under stale fence.
  negative_proofs:
  - Kill worker at each transaction boundary and verify all-or-none.
  - Reusing operation id with new payload fails even after restart.
