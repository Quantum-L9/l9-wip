- item: External retention-policy decision interface
  reason: Exact external policy authority/decision contract is not yet bound. State-owned
    mechanics are reviewable; RetentionExecutor activation remains intentionally disabled.
  material: true
- item: Live runtime behavior under external dependencies
  reason: No live Mongo replica-set/fault injection, real Gate round trip, or installed-package
    evidence in this environment.
  material: true
- item: Formal EvidenceAssessment receipt
  reason: evidence-review-engine is unavailable in this runtime; direct artifact evidence
    is bound instead, so no producer-owned evidence.assessment/v1 is claimed.
  material: false
audit_status: REOPEN_REQUIRED
