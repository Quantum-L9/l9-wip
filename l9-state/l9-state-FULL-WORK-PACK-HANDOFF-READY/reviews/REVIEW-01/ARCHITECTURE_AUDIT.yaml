  basis_refs:
  - STATE-ATOMIC-001
  - STATE-REV-001
  - STATE-IDEMP-001
  - STATE-FENCE-001
  - STATE-OUTCOME-001
  - STATE-AMBIGUITY-001
  summary: Combined reference/Mongo implementation preserves the locked transaction
