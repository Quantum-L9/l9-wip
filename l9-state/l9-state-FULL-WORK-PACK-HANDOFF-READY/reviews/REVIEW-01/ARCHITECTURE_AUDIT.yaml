- subject: Journal/cold-resume contract
  status: FINDING
  basis_refs:
  - GAR-F-002
  - STATE-JOURNAL-001
  - STATE-CURSOR-001
  summary: Core capture/cursor design is aligned, but new-consumer retention semantics
    violate the event contract.
- subject: Retry-safety invariant
  status: FINDING
  basis_refs:
  - GAR-F-004
  - STATE-RETRY-001
  summary: retry_class is part of the right vocabulary but is emitted with mutation
