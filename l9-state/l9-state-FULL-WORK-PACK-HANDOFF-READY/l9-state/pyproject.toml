[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l9-state"
version = "0.1.0"
description = "L9 provider-neutral durable state authority"
requires-python = ">=3.12"
dependencies = [
  "constellation-node-sdk @ git+https://github.com/Quantum-L9/Gate_SDK.git@v1",
  "pydantic>=2.9.0",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
server = ["pymongo==4.18.2"]
dev = ["pymongo==4.18.2", "pytest>=8.3.0", "pytest-asyncio>=0.23.8", "ruff>=0.6.0", "mypy>=1.11.0", "jsonschema>=4.23.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
