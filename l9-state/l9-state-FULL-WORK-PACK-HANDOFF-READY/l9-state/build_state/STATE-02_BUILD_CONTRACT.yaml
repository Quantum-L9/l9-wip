  id: L9-STATE-STATE-02A-2026-09-27
  authority: USER_APPROVED
  scope:
    - Gate-bound ExecutionBudget
    - explicit bounded Mongo retry and reconciliation policy
    - durable conflict/refused terminal receipts
    - retry-safety versus recovery-guidance taxonomy reconciliation
    - nine locked operation-execution invariants
  no_public_schema_change: true
