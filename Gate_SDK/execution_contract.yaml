  - sdk-03-implementation-diff
  - sdk-03-contract-tests
  - sdk-03-evidence-receipt.json
  steps:
  - Inspect existing chunk/stream/session and child-lineage contracts.
  - Prove single-budget bounded semantic operations and correlated responses.
  - Where streaming is absent, require explicit unavailable/final-turn operation rather than alternate transport.
  - Add only owner-native minimal protocol changes when separately justified by current evidence.
  acceptance:
  - One transport implementation and no peer connection escape.
  - SDK remains domain-payload opaque.
  negative_proofs:
  - Provider-specific turn/payload classes do not enter SDK core.
  - A client cannot become a node by requesting a session.
