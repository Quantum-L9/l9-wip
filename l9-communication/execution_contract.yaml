units:
- id: COMM-01
  repo: l9-communication
  title: Birth communication payloads and provider-composition boundary
  phase: 3
  depends_on:
  - EXT-01
  - SDK-02
  - GATE-01
  status: not_started
  authority: implementation_contract; requires current repository baseline and user-authorized execution session
  allowed_paths:
  - src/
  - contracts/
  - tests/
  - docs/
  - engine/
  forbidden_changes:
  - other repositories in this unit
  - production deployment
  - live data migration without explicit authorization
  - secret changes
  - weakening owner invariants
  - unrelated cleanup
  deliverables:
  - comm-01-implementation-diff
  - comm-01-contract-tests
  - comm-01-evidence-receipt.json
  steps:
  - Use the current canonical node birth path.
  - Implement strict payload validation and generic capability descriptors.
  - Keep AgentOS cognition and provider composition distinct.
  - Implement authenticated external input boundary and native channel correlation contracts.
  acceptance:
  - All proposed communication payloads have strict positive/negative tests.
  - No provider-specific field or peer URL enters canonical requests.
  negative_proofs:
  - Provider tool/memory defaults are refused by composition admission.
  - Webhook body cannot choose tenant or node role.
  checkpoint:
    receipt_type: repo_unit_evidence
    required_fields:
    - unit_id
    - repo
    - base_sha
    - head_sha
    - contract_digest
    - changed_paths
    - commands
    - exit_codes
    - assertion_results
    - negative_test_results
    - artifact_digests
    - remaining_unknowns
    pass_rule: all acceptance assertions demonstrated; all required negative proofs pass; no blocking unknown;
      receipt bound to tested head
  failure_policy: Stop only affected dependency branch; preserve evidence; do not mark complete. Diagnose whether
    contract, source, environment or implementation caused the failure.
  rollback: Before activation revert this isolated PR after checking dependent unpublished work. After effects
    or data cutover, preserve receipts and perform owner-approved forward recovery; never re-enable a second
    writer.
  pr_policy:
    one_repo: true
    draft_until_verified: true
    stack: Only on unmerged same-repo prerequisite when unavoidable; record base/head relationship. Prefer
      prerequisite merge before next unit.
    merge_authority: not_granted_by_this_pack
