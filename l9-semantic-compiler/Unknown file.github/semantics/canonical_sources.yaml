  - id: l9.source/compilation-profiles@1
    path: semantics/compilation_profiles.yaml
    format: yaml
    canonical: true
    projection_allowed: true
    derivation_allowed: false
  - id: l9.source/projection-profiles@1
    path: semantics/projection_profiles.yaml
    format: yaml
    canonical: true
    projection_allowed: true
    derivation_allowed: false
  - id: l9.source/architecture-patterns@1
    path: semantics/architecture_patterns.yaml
    format: yaml
    canonical: true
    projection_allowed: true
