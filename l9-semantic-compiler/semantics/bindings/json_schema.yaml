schema: l9.binding/v1
artifact_id: l9.binding/json-schema-2020-12@1
canonical: true
class: target
source_semantic_class:
  - structural_requirements_ir
target_semantic_class:
  - json_schema_ir
target:
  technology: json-schema
  version: "2020-12"
schema_uri: https://json-schema.org/draft/2020-12/schema
semantic_type_map:
  string:
    type: string
  integer:
    type: integer
  number:
    type: number
  boolean:
    type: boolean
  object:
    type: object
  array:
    type: array
  semantic_digest:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  reference:
    type: string
    minLength: 1
  any: {}
rules:
  - required_contract_field_maps_to_required_json_schema_field
  - enum_maps_to_enum
  - descriptions_may_be_preserved
  - unknown_semantic_type_fails_closed
  - binding_does_not_invent_field_type
