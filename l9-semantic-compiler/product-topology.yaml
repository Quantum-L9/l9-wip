    - l9.semantic-compiler.compat/semantic-spec@1
    - l9.semantic-compiler.compat/domain-calculus@1
    - l9.semantic-compiler.compat/compilation-profile@1
    - l9.semantic-compiler.compat/target-capability-profile@1
    - l9.semantic-compiler.compat/target-binding@1
    - l9.semantic-compiler.compat/target-ir@1
    - l9.semantic-compiler.compat/artifact-plan@1
    - l9.semantic-compiler.compat/compilation-receipt@1
    - l9.semantic-compiler.compat/conformance-handoff@1

  provider_compatibility_refs: []

distribution:
  artifact_forms:
    - python_package

  release_contract_refs:
    - l9.semantic-compiler.contract/release@1

build:
  compilation_profile_ref: l9.compilation/product-build@1

  source_owned_surfaces:
    - ProductTopology
    - SemanticSpec contract
    - Semantic Algebra
    - compiler pass contracts
    - compiler-domain invariants
    - Domain Calculus integration contract
    - Semantic IR contract
    - Reference Interpreter contract
