      blocks:
        - canonical_transition_implementation

    - id: U-WORKFLOW-WM-007
      item: exact first persistence provider
      reason: >
        No provider is intentionally selected by canonical workflow semantics.
      blocks: []

    - id: U-WORKFLOW-WM-008
      item: exact first admitted World Domain
      reason: >
