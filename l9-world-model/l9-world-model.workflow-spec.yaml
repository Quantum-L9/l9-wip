unknowns:
  material:
    - id: U-WORKFLOW-WM-001
      item: exact admitted Workflow Calculus coordinate
      reason: >
        The workflow semantics are sufficiently defined for a candidate
        WorkflowSpec, but the exact current canonical Workflow Calculus
        coordinate has not been bound.
      blocks:
        - workflow_admission

    - id: U-WORKFLOW-WM-002
      item: exact current ProductTopology revision and digest
      reason: >
        Workflow execution requires exact binding to the admitted candidate
        ProductTopology.
      blocks:
        - workflow_admission
        - runtime_execution

    - id: U-WORKFLOW-WM-003
      item: exact current RepositorySpec revision and digest
      reason: >
        Runtime realization must bind the exact repository semantic contract.
      blocks:
        - workflow_admission
        - runtime_execution

    - id: U-WORKFLOW-WM-004
      item: exact serialized schema for World Model capability request and result contracts
      reason: >
        Semantic operations are defined, but externally serialized field-level
        schemas require explicit schema lock and golden vectors.
      blocks:
