        - runtime_admission

    - id: U-WORKFLOW-WM-005
      item: exact WorldStatePersistence serialized contract
      reason: >
        Atomic revisioned persistence semantics are defined but wire-level
        provider-neutral fields remain to be canonically locked.
      blocks:
        - canonical_transition_implementation

    - id: U-WORKFLOW-WM-006
      item: exact atomic transition realization
      reason: >
