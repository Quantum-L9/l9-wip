unknowns:
  material:
    - id: U-WM-001
      item: exact admitted ProductArchetype reference for l9-world-model
      reason: >
        No exact current archetype coordinate has been bound into this
        candidate topology.
      blocks:
        - final_product_admission
    - id: U-WM-002
      item: exact admitted lifecycle family and lifecycle-state coordinates
      reason: >
        Lifecycle semantics must resolve from current canonical upstream
        semantics rather than be invented locally.
      blocks:
        - final_product_admission
    - id: U-WM-003
      item: exact canonical constellation transport contract coordinates
      reason: >
        Cross-node transport is required, but the precise current canonical
        contract coordinates have not been bound into this candidate file.
      blocks:
        - runtime_admission
    - id: U-WM-004
      item: exact world-state persistence provider
      reason: >
        Persistence semantics are defined by a provider-neutral port and
        provider selection is intentionally deferred.
      blocks: []
    - id: U-WM-005
      item: exact world-state persistence substrate compatibility profile
      reason: >
        Reuse of an existing generic state substrate is preferred if it
        satisfies the WorldStatePersistence contract, but no provider is
        constitutionally selected here.
      blocks:
        - implementation_selection
    - id: U-WM-006
      item: exact projection provider set
      reason: >
        Projection semantics are intentionally representation-neutral and no
        graph relational timeline visualization or future provider is selected
        by ProductTopology.
      blocks: []
    - id: U-WM-007
      item: exact externally serialized schemas for World Model public contracts
      reason: >
        Semantic boundaries are sufficiently defined for ProductTopology, but
        wire schemas require separate explicit design and golden vectors before
        implementation.
      blocks:
        - implementation
        - product_admission
    - id: U-WM-008
      item: exact first admitted World Domain
      reason: >
        Engineered System Model is the leading first domain candidate, but
        domain admission is a separate concern from global World Model product
        definition.
      blocks:
        - first_domain_integration
    - id: U-WM-009
      item: exact mapping between evidence-owner receipts and WorldObservation admission
      reason: >
        Evidence remains independently owned and the precise serialized seam
        must be schema-locked before implementation.
      blocks:
        - evidence_integrated_observation_admission
    - id: U-WM-010
      item: exact memory-publication seam
      reason: >
        World Model may optionally publish governed contextual knowledge to the
        owning memory capability, but the precise contract is not yet locked.
      blocks: []
    - id: U-WM-011
      item: exact semantic-compiler relationship
      reason: >
        Semantic Compiler may become useful for derived World Domain,
        projection, or repository artifacts, but it is not required for the
        canonical World Model semantic definition and its exact integration is
        intentionally deferred.
      blocks: []
    - id: U-WM-012
      item: exact scaling partition strategy
      reason: >
        Scaling must preserve world identity revision ordering and transaction
        boundaries; the concrete partition strategy is a realization decision.
      blocks:
        - production_readiness
    - id: U-WM-013
      item: exact atomic transition realization
      reason: >
        The semantic requirement for revision-checked atomic transition is
        locked, while concrete transactional or fenced realization remains
        provider-bound.
      blocks:
        - implementation
    - id: U-WM-014
      item: exact historical World Domain migration protocol
      reason: >
        Historical replay must preserve historical semantics, but the canonical
        protocol for domain evolution and migration requires a dedicated
        contract.
      blocks:
        - incompatible_domain_upgrade
  non_material:
    - id: U-WM-N001
      item: initial graph projection technology
      reason: >
        Graph projection is derived and provider-neutral; choosing one provider
        does not affect ProductTopology semantics.
    - id: U-WM-N002
      item: initial visualization technology
      reason: >
        Visualization is a derived projection and has zero canonical-state
        authority.
    - id: U-WM-N003
      item: initial local development persistence technology
      reason: >
        Local realization may vary behind the persistence contract without
        changing product semantics.
    - id: U-WM-N004
      item: initial implementation language
      reason: >
        No implementation language is required by the semantic architecture.
    - id: U-WM-N005
