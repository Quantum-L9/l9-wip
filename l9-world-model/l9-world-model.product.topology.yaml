    - explicit authorization for consequential operations
    - exact expected WorldRevision for canonical state transition
    - exact World Domain binding where not already resolvable from world identity
    - explicit handling of Unknown degraded stale and conflicting outcomes
  forbidden_consumption_modes:
    - direct_peer_database_access
    - direct_peer_backing_store_read
    - direct_peer_backing_store_write
    - provider_native_api_as_world_contract
