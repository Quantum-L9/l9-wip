    - retrieved_memory_as_canonical_world_state
    - projection_as_canonical_world_state
    - hypothetical_branch_as_canonical_world_state

deployment:
  model: independent_runtime
  deployment_unit: node_runtime
  runtime_boundary: independent_world_model_runtime
  scaling_boundary: world_identity_and_declared_partition_boundary
  failure_boundary: world_model_runtime_and_world_partition
  upgrade_boundary: world_model_release_plus_domain_compatibility_boundary
  artifact_forms:
    - container_image
    - source_distribution
  deployment_constraints:
    - semantic core remains independently testable without constellation transport
    - deterministic reducer remains independently testable without persistence provider
    - deterministic reducer remains independently testable without projection provider
    - deterministic reducer remains independently testable without memory capability
    - canonical reduction path requires no LLM credentials
    - provider bindings remain deployment concerns
    - deployment never self-admits the product
    - deployment never self-admits the runtime
    - persistence-provider replacement requires conformance proof
    - projection-provider replacement requires conformance proof
    - exact runtime identity remains observable
    - health and readiness are independently exposed
    - no provider-specific schema becomes canonical World Model schema

