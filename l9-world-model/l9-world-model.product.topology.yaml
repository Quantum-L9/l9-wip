    - l9.world-model.contract/world-transition-transaction@1
  hard_constraints:
    - every material authoritative modeled state value has an exact StateAddress
    - every authoritative modeled state value is valid only at an exact WorldCoordinate
    - persistent WorldEntity identity is separate from mutable modeled state
    - canonical modeled state changes only through admitted typed WorldEvents
    - WorldObservations cannot directly mutate canonical modeled state
    - observation admission preserves source authority and exact evidence coordinates
    - source-owned truth remains source-owned after modeling
    - modeled-world authority never launders or transfers source-system authority
    - canonical world reduction is deterministic
    - canonical world reduction does not require an LLM
    - identical exact reduction inputs produce identical successor state and digest
    - every WorldRevision identifies its exact predecessor revision
    - every WorldRevision identifies the exact accepted event or atomic accepted event set that established it
    - every material StateCell identifies its establishing event
    - every material StateCell preserves applicable source and evidence provenance
    - every WorldSnapshot binds exact world revision and exact domain binding
    - historical revisions are immutable
    - corrections create successor events and successor revisions
    - historical correction never rewrites an earlier WorldRevision
    - replay from accepted events reconstructs the same modeled state as the corresponding valid snapshot
    - exact World Domain identity revision and digest bind every canonical reduction
    - unresolved World Domain semantics block canonical transition
    - incompatible World Domain versions never silently compose
    - domain-specific semantics never become hidden global World Model semantics
    - hypothetical branches remain isolated from canonical modeled state
    - hypothetical events remain noncanonical
    - branch promotion cannot copy hypothetical state directly into canonical state
    - a branch-inspired real transition must be independently authorized executed observed admitted and reduced
    - projections remain derived and rebuildable
    - projection failure cannot redefine canonical state
    - projection provider identity cannot define World Model semantics
    - persistence provider identity cannot define World Model semantics
    - memory provider identity cannot define World Model semantics
    - graph representation is not required by canonical World Model semantics
    - property-graph semantics are not required by canonical World Model semantics
    - vector-memory semantics are not required by canonical World Model semantics
    - provider substitution does not change product semantics
    - missing evidence remains explicit
    - stale evidence remains explicit
    - conflicting observations remain explicit until resolved by applicable admission semantics
    - unavailable observation sources do not create negative world assertions
    - transport success does not constitute observation admission
    - query success does not grant mutation authority
    - projection success does not grant mutation authority
    - receipt generation does not grant mutation authority
    - World Domains cannot redefine global World Model invariants
    - material Unknown affecting canonical transition validity blocks transition
    - bounded queries preserve exact coordinate and revision metadata
    - canonical history remains reconstructible from revision and event lineage
    - provider-native identities do not replace WorldEntity identity
    - provider-native timestamps do not silently replace WorldCoordinate semantics
    - direct backing-store reads by consumers are forbidden
    - direct backing-store writes by consumers are forbidden
  operational_requirements:
    - independently deployable
    - independently scalable
    - independently health-checkable
    - independently readiness-checkable
    - exact runtime identity
    - canonical L9 constellation transport for cross-node invocation
    - bounded query execution
    - bounded branch execution
    - bounded projection execution
    - explicit revision conflict detection
    - exact World Domain binding validation
    - exact state reconstruction
    - snapshot and replay validation
    - explicit provider degradation
    - explicit projection degradation
    - explicit stale-result semantics
    - explicit unavailable-result semantics
    - explicit conflict semantics
    - no direct peer database access
    - no direct peer routing
    - no hidden provider selection
    - no hidden World Domain selection
    - no hidden fallback that changes semantics
    - no cross-world scope escape
    - no authority gain from data availability

capabilities:
  provides:
    - capability_ref: l9.world-model.capability/resolve
      contract_refs:
        - l9.world-model.contract/world-resolve@1
      semantics: >
        Resolve canonical modeled world state at an exact WorldCoordinate and
        WorldRevision or return explicit unavailable stale conflicting or
        insufficient status.
    - capability_ref: l9.world-model.capability/query
      contract_refs:
        - l9.world-model.contract/world-query@1
      semantics: >
        Query a bounded subset of canonical modeled world state while
        preserving revision coordinate provenance coverage and degradation.
    - capability_ref: l9.world-model.capability/observe
      contract_refs:
        - l9.world-model.contract/world-observation@1
        - l9.world-model.contract/observation-admission@1
        - l9.world-model.contract/canonical-world-transition@1
      semantics: >
        Evaluate an evidence-bound candidate observation under exact World
        Domain admission semantics and, when admitted and authorized, commit
        the resulting canonical WorldEvent transition.
    - capability_ref: l9.world-model.capability/history
      contract_refs:
        - l9.world-model.contract/world-history@1
      semantics: >
        Resolve canonical revision and event history for a world subject scope
        or StateAddress.
    - capability_ref: l9.world-model.capability/lineage
      contract_refs:
        - l9.world-model.contract/world-lineage@1
      semantics: >
        Explain why modeled state is present by tracing StateCells through
        establishing events supporting evidence source authority and causal
        lineage.
    - capability_ref: l9.world-model.capability/diff
      contract_refs:
        - l9.world-model.contract/world-diff@1
      semantics: >
        Compare two exact WorldCoordinates or WorldRevisions without silently
        collapsing Unknown unavailable stale or incomparable state.
    - capability_ref: l9.world-model.capability/branch
      contract_refs:
        - l9.world-model.contract/world-branch@1
      semantics: >
        Create and resolve isolated noncanonical hypothetical trajectories from
        an exact canonical base revision without mutating canonical modeled
        world state.
    - capability_ref: l9.world-model.capability/project
      contract_refs:
        - l9.world-model.contract/world-projection@1
      semantics: >
        Produce a rebuildable target representation from exact modeled world
        state under an explicit projection profile without granting authority
        to the target representation.
  requires: []
  optional:
    - capability_ref: l9.evidence.capability/verify
      contract_refs: []
    - capability_ref: l9.memory.capability/publish
      contract_refs: []
    - capability_ref: l9.semantic-compiler.capability/compile
      contract_refs: []
  degraded_without:
