    - l9.pattern/canonical-source-derived-projections@1
    - l9.pattern/facts-plus-lineage-compiled-views@1
    - l9.pattern/fixture-backed-conformance@1
  forbidden_pattern_refs: []
  structural_constraints:
    - World Model semantic core is independent from constellation transport mechanics
    - World Model semantic core is independent from persistence-provider mechanics
    - World Model semantic core is independent from projection-provider mechanics
    - World Model semantic core is independent from memory-provider mechanics
    - World Model semantic core contains no domain-specific entity vocabulary
    - World Model semantic core contains no domain-specific event vocabulary
    - World Model semantic core contains no domain-specific relationship vocabulary
    - World Model semantic core contains no provider-specific graph vocabulary
    - World Domain semantics bind through an explicit extension contract
    - global World Model law outranks World Domain specialization
    - World Domain specialization cannot weaken core invariants
    - canonical state transition is observation admission followed by WorldEvent followed by deterministic reduction followed by revision commit
    - canonical state transition does not depend on derived projections
    - canonical state transition does not depend on memory publication
    - canonical state transition does not depend on visualization
    - canonical state transition does not depend on graph materialization
    - canonical state transition does not depend on LLM judgment
    - derived read models are disposable and rebuildable
    - canonical modeled state is reconstructible without derived read models
    - branches are isolated from canonical revisions
    - branch operations never imply external execution
    - exact WorldCoordinates are preserved across resolve query history lineage diff branch and projection operations
    - provider replacement does not alter public semantic contracts
    - source-system authority remains externally owned
    - modeled-world authority remains scoped to the admitted modeled representation

