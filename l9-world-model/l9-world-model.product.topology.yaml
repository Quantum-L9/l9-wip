    - branch recovery requires exact branch base revision and branch event sequence
    - interrupted canonical transition cannot be guessed complete
    - interrupted transition outcome must resolve from persistence transaction evidence or remain Unknown
  replay_semantics:
    - full canonical event replay reconstructs deterministic state
    - replay uses exact historical World Domain coordinates applicable to each event
    - replay never silently substitutes current World Domain semantics for historical semantics
    - snapshot replay and full event replay must agree for equivalent coordinates
    - divergence blocks readiness until reconciled
  compensation_semantics:
    - world-state correction uses successor events
    - historical events are never deleted merely to simplify current state
    - external real-world compensation remains owned by the applicable external executor
    - a compensating real-world action is modeled only after observation and admission
  recovery_requirements:
