  deliverables:
  - Gate/public-SDK parity tests
  - privacy tests
  - projection outage tests
  steps:
  - Exercise ordinary and consent-sensitive records using same service.
  - Verify scope-specific retrieval and evidence-bearing failures.
  - Round-trip supersession, archival, conflict-sensitive writes and deletion.
  - Prove optional projection outages cannot falsify receipt or canonical record status.
  acceptance:
  - All profiles use same APIs; policy restricts use without separate engines.
  - Partial retrieval is never reported as empty complete memory.
  negative_proofs:
  - Sibling manifestation memory denied without explicit grant.
  - Forged memory-only policy cannot authorize an external action.
