repo: Quantum-L9/l9-memory
status: planned
unit_count: 2
units:
- id: MEM-01
  repo: l9-memory
  title: Birth thin Gate node over existing MemoryService
  phase: 3
  depends_on:
  - MEMCORE-02
  - SDK-02
  - GATE-01
  status: not_started
  authority: implementation_contract; requires current repository baseline and user-authorized execution session
  allowed_paths:
  - src/
  - tests/
  - contracts/
  - docs/
  - pyproject.toml
  - uv.lock
  forbidden_changes:
  - other repositories in this unit
  - production deployment
  - live data migration without explicit authorization
  - secret changes
  - weakening owner invariants
  - unrelated cleanup
  deliverables:
  - memory node wrapper
  - owner request/receipt bindings
  - principal adapter
  steps:
  - Compose approved memory package in node-owned deployment.
  - Validate domain request against exact owner model, not this pack shell alone.
  - Map authenticated scope/purpose to owner principal without widening.
  - Route all inter-node calls through Gate; provider connections remain owner-local.
  acceptance:
  - MemoryService is the sole memory authority.
  - No new canonical MemoryRecord or lifecycle state machine.
  negative_proofs:
  - Direct backing-table/provider access from wrapper forbidden.
  - Forged source or principal refuses before canonical write.
  checkpoint:
    receipt_type: repo_unit_evidence
    required_fields:
    - unit_id
    - repo
    - base_sha
    - head_sha
    - contract_digest
    - changed_paths
    - commands
    - exit_codes
    - assertion_results
    - negative_test_results
    - artifact_digests
    - remaining_unknowns
    pass_rule: all acceptance assertions demonstrated; all required negative proofs pass; no blocking unknown;
      receipt bound to tested head
  failure_policy: Stop only affected dependency branch; preserve evidence; do not mark complete. Diagnose whether
    contract, source, environment or implementation caused the failure.
  rollback: Before activation revert this isolated PR after checking dependent unpublished work. After effects
    or data cutover, preserve receipts and perform owner-approved forward recovery; never re-enable a second
    writer.
  pr_policy:
    one_repo: true
    draft_until_verified: true
    stack: Only on unmerged same-repo prerequisite when unavoidable; record base/head relationship. Prefer
      prerequisite merge before next unit.
    merge_authority: not_granted_by_this_pack
- id: MEM-02
  repo: l9-memory
  title: Prove shared memory capabilities across manifestations
  phase: 4
  depends_on:
