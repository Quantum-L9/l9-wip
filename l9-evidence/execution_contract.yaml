units:
- id: EVID-01
  repo: l9-evidence
  title: Birth source/evidence retention contract
  phase: 3
  depends_on:
  - AG-01
  - SDK-02
  - GATE-01
  status: not_started
  authority: implementation_contract; requires current repository baseline and user-authorized execution session
  allowed_paths:
  - src/
  - tests/
  - contracts/
  - docs/
  - pyproject.toml
  - uv.lock
  forbidden_changes:
  - other repositories in this unit
  - production deployment
  - live data migration without explicit authorization
  - secret changes
  - weakening owner invariants
  - unrelated cleanup
  deliverables:
  - EvidenceService
  - ArtifactRef/SourceRef contracts
  - storage adapter ports
  - retention receipts
  steps:
  - Finalize evidence identity, exact locator and artifact provenance.
  - Separate source-owned truth from retained copies and view indexes.
  - Implement staged blob finalize with integrity and quarantine on partial commit.
  - Authenticate every resolve/get independent of reference possession.
  acceptance:
  - Accepted evidence resolves exact authorized bytes or a typed unavailable state.
  - Evidence append does not authorize actions.
  negative_proofs:
  - Mismatched bytes/digest rejected.
  - Bearer-like source URL cannot bypass policy or SSRF controls.
  checkpoint:
    receipt_type: repo_unit_evidence
    required_fields:
    - unit_id
    - repo
    - base_sha
    - head_sha
    - contract_digest
    - changed_paths
    - commands
    - exit_codes
    - assertion_results
    - negative_test_results
    - artifact_digests
    - remaining_unknowns
    pass_rule: all acceptance assertions demonstrated; all required negative proofs pass; no blocking unknown;
      receipt bound to tested head
  failure_policy: Stop only affected dependency branch; preserve evidence; do not mark complete. Diagnose whether
    contract, source, environment or implementation caused the failure.
  rollback: Before activation revert this isolated PR after checking dependent unpublished work. After effects
    or data cutover, preserve receipts and perform owner-approved forward recovery; never re-enable a second
    writer.
  pr_policy:
    one_repo: true
    draft_until_verified: true
    stack: Only on unmerged same-repo prerequisite when unavoidable; record base/head relationship. Prefer
      prerequisite merge before next unit.
    merge_authority: not_granted_by_this_pack
