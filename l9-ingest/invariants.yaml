invariants:
- id: L9-014
  assertion: Transformation produces candidates and source-processing receipts, never downstream admission
    claims.
  negative_proof: Mixed destination success preserves separate results and retries only unresolved deliveries.
- id: L9-019
  assertion: Sensitive source processing is purpose-limited; preserved source bytes never imply permission
    to embed or memorize.
  negative_proof: Profile-forbidden raw body and transcript are rejected before external model or index use.
- id: L9-029
  assertion: Embedding identity binds representation, model revision, dimensions, similarity space and privacy
    scope.
  negative_proof: Mismatched query/index model or scope is rejected; unchanged content is not re-embedded.
