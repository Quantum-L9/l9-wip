repo: Quantum-L9/l9-ingest
status: planned
unit_count: 3
units:
- id: ING-01
  repo: l9-ingest
  title: Birth bounded source workflow and admission-neutral profiles
  phase: 4
  depends_on:
  - AG-01
  - STATE-01
  - EVID-01
  - MEM-01
  - GATE-01
  status: not_started
  authority: implementation_contract; requires current repository baseline and user-authorized execution session
  allowed_paths:
  - src/
  - tests/
  - contracts/
  - docs/
  - pyproject.toml
  - uv.lock
  forbidden_changes:
  - other repositories in this unit
  - production deployment
  - live data migration without explicit authorization
  - secret changes
  - weakening owner invariants
  - unrelated cleanup
  deliverables:
  - ingestion-profile contract
  - source stage graph
  - typed stage receipts
  steps:
  - Reuse donor logic only after source/host assumptions are removed.
  - Validate artifact/ref/digest/purpose before parsing.
  - Apply byte, decompression, page, runtime and redaction bounds.
  - Keep job state behind State and source evidence behind Evidence.
  acceptance:
  - No local canonical job database or direct memory provider access.
  - Profile forbids inappropriate source retention/embedding before model calls.
  negative_proofs:
  - Archive traversal/zip bomb refused.
  - Malformed source cannot be labeled successfully captured.
  checkpoint:
    receipt_type: repo_unit_evidence
    required_fields:
    - unit_id
    - repo
    - base_sha
    - head_sha
    - contract_digest
    - changed_paths
    - commands
    - exit_codes
    - assertion_results
    - negative_test_results
    - artifact_digests
    - remaining_unknowns
    pass_rule: all acceptance assertions demonstrated; all required negative proofs pass; no blocking unknown;
      receipt bound to tested head
  failure_policy: Stop only affected dependency branch; preserve evidence; do not mark complete. Diagnose whether
    contract, source, environment or implementation caused the failure.
  rollback: Before activation revert this isolated PR after checking dependent unpublished work. After effects
    or data cutover, preserve receipts and perform owner-approved forward recovery; never re-enable a second
    writer.
  pr_policy:
    one_repo: true
    draft_until_verified: true
    stack: Only on unmerged same-repo prerequisite when unavoidable; record base/head relationship. Prefer
      prerequisite merge before next unit.
    merge_authority: not_granted_by_this_pack
