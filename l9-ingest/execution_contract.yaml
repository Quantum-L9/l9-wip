  steps:
  - Commit candidate delivery intents before calls using State-owned durable mechanics.
  - Assign stable per-destination operation identities.
  - Reconcile unknown owner response before retry and retain rejected/quarantined dispositions.
  - Replay only approved projections, never operational effects.
  acceptance:
  - One successful destination is not replayed because another failed.
  - Complete requires every required destination settled with authoritative receipt.
  negative_proofs:
  - Timeout after memory admission does not create a duplicate fact under a new key.
  - Privacy-erased source cannot resurrect through replay.
