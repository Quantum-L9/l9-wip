  - end-to-end signed rail tests
  - role-aware readiness
  steps:
  - Inspect which packet types ingress actually admits; define bounded State event relay using supported owner
    APIs.
  - Separate durable accepted-work receipts from completed-operation receipts.
  - Exercise no healthy owner, unknown action, expiry and cancellation without peer fallback.
  - Prove node-to-Gate-to-node scopes and parent causation.
  acceptance:
  - Async acceptance cannot be interpreted as external execution completion.
  - No capability work is dispatched to a consumer address.
  negative_proofs:
  - Owner outage returns typed unavailable without direct-peer bypass.
  - Long-running continuation cannot reset spent budget or impersonate a new objective.
