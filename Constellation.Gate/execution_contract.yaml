- id: GATE-01
  repo: Constellation.Gate
  title: Bind trusted roles and generic action ownership
  phase: 2
  depends_on:
  - SDK-01
  - AG-01
  status: not_started
  authority: implementation_contract; requires current repository baseline and user-authorized execution session
  allowed_paths:
  - constellation-gate/src/constellation_gate/boundary/
  - constellation-gate/src/constellation_gate/routing/
  - constellation-gate/src/constellation_gate/runtime/
  - constellation-gate/tests/
  - constellation-gate/docs/
  forbidden_changes:
  - other repositories in this unit
  - production deployment
  - live data migration without explicit authorization
  - secret changes
  - weakening owner invariants
  - unrelated cleanup
  deliverables:
  - role admission rules
  - six owner action families
  - registration conformance
  steps:
  - Bind role and source identity to authenticated principal.
  - Register proposed action namespaces only after owner contract publication.
  - Enforce semantic owner collisions for all new actions and replicas.
  - Retain SDK dispatch transport and existing deadline clamping.
  acceptance:
  - Client may invoke only allowed actions but cannot register/receive node dispatch.
  - All six node families resolve by action, never client-supplied destination.
  negative_proofs:
  - Owner collision rejects registration.
  - Registered-looking client principal cannot become worker.
  checkpoint:
    receipt_type: repo_unit_evidence
    required_fields:
    - unit_id
    - repo
    - base_sha
    - head_sha
    - contract_digest
    - changed_paths
    - commands
    - exit_codes
    - assertion_results
    - negative_test_results
    - artifact_digests
    - remaining_unknowns
    pass_rule: all acceptance assertions demonstrated; all required negative proofs pass; no blocking unknown;
      receipt bound to tested head
  failure_policy: Stop only affected dependency branch; preserve evidence; do not mark complete. Diagnose whether
    contract, source, environment or implementation caused the failure.
  rollback: Before activation revert this isolated PR after checking dependent unpublished work. After effects
    or data cutover, preserve receipts and perform owner-approved forward recovery; never re-enable a second
    writer.
  pr_policy:
    one_repo: true
    draft_until_verified: true
    stack: Only on unmerged same-repo prerequisite when unavoidable; record base/head relationship. Prefer
      prerequisite merge before next unit.
    merge_authority: not_granted_by_this_pack
